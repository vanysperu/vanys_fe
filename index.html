<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- ?v=2: ícono "V con engranaje". Al cambiar el ícono se sube este número,
         si no el navegador sigue mostrando el anterior desde su caché. -->
    <link rel="icon" type="image/png" href="/favicon.png?v=2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <!-- Color de la barra del navegador en el celular: azul marino Vanys. -->
    <meta name="theme-color" content="#001d52" />
    <!-- App instalable (iPhone: Safari → Compartir → "Agregar a pantalla de
         inicio"). El manifest da nombre, ícono y modo pantalla completa; las
         etiquetas apple-* son las que lee iOS. Con status-bar "default" el
         contenido nunca queda debajo del reloj/notch (sin viewport-fit=cover
         no hace falta compensar safe areas). Ver public/sw.js. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Vanys" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Vanys</title>
  </head>
  <body>
    <script>
      // Aplica el tema guardado antes del primer render de React para evitar
      // un flash de tema incorrecto (FOUC) al cargar la página.
      (function () {
        try {
          var stored = localStorage.getItem('grulla-theme');
          var isDark =
            stored === 'dark' ||
            (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', isDark);
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <!-- Configuración editable sin recompilar (URL de la API) — ver public/config.js.
         Va antes de la app para que ya esté disponible al arrancar. -->
    <script src="/config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
